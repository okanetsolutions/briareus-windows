name: Feature request
description: Something the app should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: If the dashboard already does it, say where.
    validations:
      required: true

name: Bug report
description: Something in the app does not work as it should.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version
      description: From the release you installed, or the commit you built.
      placeholder: v1.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: A screenshot helps. Do not include your device token or server address.
    validations:
      required: true
